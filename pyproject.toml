[project]
name = "kicad-mcp"
version = "0.1.0"
description = "MCP server that talks to a running KiCad instance over the official IPC API."
readme = "README.md"
authors = [
    { name = "Tejasvi Varadaraj", email = "tejasvipradhyumna@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "kicad-python>=0.7.1",
    "mcp[cli]>=2.0.0",
    "pydantic>=2.13.4",
]

[project.scripts]
kicad-mcp = "kicad_mcp:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

